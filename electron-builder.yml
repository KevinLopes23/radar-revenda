appId: br.kevma.achadao
productName: Achadão
copyright: Uso pessoal
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# O Playwright lê arquivos próprios em tempo de execução; fora do .asar é mais seguro.
asarUnpack:
  - node_modules/playwright-core/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Achadao-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Achadão
  uninstallDisplayName: Achadão
  deleteAppDataOnUninstall: false
